name: Synchronise source

on:
  push:
    branches: [master]
    paths:
      - '.sync/source.b64'
      - '.github/workflows/sync-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract complete source tree
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .sync/source.b64 > /tmp/revision-source.tar.gz
          tar -xzf /tmp/revision-source.tar.gz -C .
          rm -rf .sync
          rm -f .github/workflows/sync-source.yml

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Synchronise la V1 multiplateforme"
          git push

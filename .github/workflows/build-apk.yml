name: Build Android release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate question bank
        run: python3 tool/validate_questions.py

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Generate Android project
        run: |
          chmod +x bootstrap_android.sh
          ./bootstrap_android.sh

      - name: Build APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Prepare release files
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk revision-arbitrage.apk
          cp build/app/outputs/bundle/release/app-release.aab revision-arbitrage.aab

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: revision-arbitrage-android
          path: |
            revision-arbitrage.apk
            revision-arbitrage.aab
          if-no-files-found: error

      - name: Publish latest GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Révision Arbitrage — dernière version
          artifacts: revision-arbitrage.apk,revision-arbitrage.aab
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          body: |
            Version Android générée automatiquement depuis la branche master.

            - `revision-arbitrage.apk` : installation directe sur Android.
            - `revision-arbitrage.aab` : bundle de préparation pour une publication Google Play. Une clé de signature de production devra être configurée avant publication.

            Aucun compte, aucune publicité et aucune connexion internet obligatoire après installation.
